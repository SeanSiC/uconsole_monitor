[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uconsole-monitor"
version = "0.1.0"
description = "Local monitor agent and tray for uConsole"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["monitor*"]

[project.scripts]
uconsole-monitor-agent = "monitor.agent.main:main"
uconsole-monitor-tray = "monitor.tray.main:main"
